name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies (heavy stacks are extras since v3)
        run: uv sync --extra ml --extra api --extra ui --extra tracking

      - name: Test CLI Installation
        run: uv run matgraph --help

      - name: Update README dynamically
        run: uv run python scripts/update_readme.py && git diff --exit-code README.md || echo "README dynamic check done"

      - name: Run tests
        run: uv run pytest -q

  slim:
    # Proves the slim base install works alone: no torch/pymatgen/mp-api,
    # demo mode + helpful errors only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install base only (no extras)
        run: uv sync

      - name: Prove heavy deps are absent
        run: uv run python scripts/check_slim.py

      - name: Demo smoke (no API key)
        run: |
          uv run matgraph predict Si --demo
          uv run matgraph xrd Si --demo
          uv run matgraph substitute LiFePO4 Li Na --demo
          uv run matgraph status

      - name: Helpful error for live path
        run: MP_API_KEY=dummy uv run matgraph predict Si 2>&1 | grep -q 'matgraph-cli\[mp\]'

      - name: Slim tests
        run: uv run pytest tests/test_demo.py tests/test_extras.py -q
