[project]
name = "matgraph-cli"
version = "0.7.0"
description = "A modern CLI and GraphQL API tool for Material Science DL Pipelines"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Himan", email = "himan@trinetralabs.ai"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "strawberry-graphql>=0.210.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "pymatgen>=2023.10.11",
    "mp-api>=0.37.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
]

[project.scripts]
matgraph = "matgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matgraph"]

[dependency-groups]
dev = ["pytest>=7.0.0"]
